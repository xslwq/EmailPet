[project]
name = "emailpet"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "aioimaplib>=1.1.0",
    "openai>=1.50.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "sqlite-vec>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["emailpet*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
